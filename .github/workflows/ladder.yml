# Works out the Online Ladder's builds every 30 minutes and stores them for visitors.
name: Online Ladder numbers
on:
  schedule:
    - cron: '23,53 * * * *'
  workflow_dispatch:
concurrency: { group: ladder, cancel-in-progress: true }
jobs:
  ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: scripts }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save --no-package-lock playwright-core@1.48.2
      - run: node scripts/ladcalc.mjs
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
